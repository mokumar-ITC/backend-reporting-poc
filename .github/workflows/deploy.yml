name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check .NET
      run: dotnet --info

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish -c Release -o publish

    - name: Stop IIS App Pool
      run: |
        Import-Module WebAdministration
        if (Test-Path IIS:\AppPools\backendService) {
            Stop-WebAppPool -Name "backendService"
        }

        Start-Sleep -Seconds 3

    - name: Deploy to IIS folder
      run: |
        Get-ChildItem "C:\inetpub\wwwroot\MDMAAppPublish" -Recurse |
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item "publish\*" "C:\inetpub\wwwroot\MDMAAppPublish" -Recurse

    - name: Start IIS App Pool
      run: |
        Import-Module WebAdministration
        Start-WebAppPool -Name "backendService"
