name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check .NET
      run: dotnet --info

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # ✅ ADD THIS STEP (IMPORTANT)
    - name: Create appsettings.Production.json
      shell: powershell
      env:
        APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:APPSETTINGS_PRODUCTION)) {
            Write-Error "APPSETTINGS_PRODUCTION secret is empty or missing"
            exit 1
        }

        $path = "BIEmbedSystem\appsettings.Production.json"

        New-Item -ItemType Directory -Path "BIEmbedSystem" -Force | Out-Null

        $env:APPSETTINGS_PRODUCTION | Out-File -FilePath $path -Encoding utf8 -Force

        Write-Host "appsettings.Production.json created at $path"


    - name: Publish
      run: dotnet publish -c Release -o publish

    # ✅ Stop IIS App Pool safely
    - name: Stop IIS App Pool
      shell: powershell
      run: |
        $pool = "backendService"
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"
        $state = & $appcmd list apppool "$pool" /text:state
        if ($state -eq "Started") {
          Write-Host "Stopping App Pool: $pool"
          & $appcmd stop apppool /apppool.name:"$pool"
          Start-Sleep -Seconds 3
        }
        else {
          Write-Host "App Pool $pool already stopped (state: $state) - continue deployment"
        }

    - name: Deploy to IIS folder
      shell: powershell
      run: |
        $target = "C:\inetpub\wwwroot\MDMAAppPublish"
        if (Test-Path $target) {
          Get-ChildItem $target -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }
        else {
          New-Item -ItemType Directory -Path $target -Force | Out-Null
        }
        Copy-Item "publish\*" $target -Recurse -Force

    # ✅ Start IIS App Pool safely
    - name: Start IIS App Pool
      shell: powershell
      run: |
        $pool = "backendService"
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"
        $state = & $appcmd list apppool "$pool" /text:state
        if ($state -ne "Started") {
          Write-Host "Starting App Pool: $pool"
          & $appcmd start apppool /apppool.name:"$pool"
        }
        else {
          Write-Host "App Pool $pool already started - OK"
        }
