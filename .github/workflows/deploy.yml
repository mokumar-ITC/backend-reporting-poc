name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check .NET
      run: dotnet --info

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish -c Release -o publish

    # ✅ Stop IIS App Pool safely (won't fail if already stopped)
    - name: Stop IIS App Pool
      shell: powershell
      run: |
        $pool = "backendService"
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"

        $state = & $appcmd list apppool "$pool" /text:state

        if ($state -eq "Started") {
          Write-Host "Stopping App Pool: $pool"
          & $appcmd stop apppool /apppool.name:"$pool"
          Start-Sleep -Seconds 3
        }
        else {
          Write-Host "App Pool $pool already stopped (state: $state) - continue deployment"
        }

    - name: Deploy to IIS folder
      shell: powershell
      run: |
        $target = "C:\inetpub\wwwroot\MDMAAppPublish"

        if (Test-Path $target) {
          Get-ChildItem $target -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        }
        else {
          New-Item -ItemType Directory -Path $target -Force | Out-Null
        }

        Copy-Item "publish\*" $target -Recurse -Force

    # ✅ Start IIS App Pool safely (won't fail if already started)
    - name: Start IIS App Pool
      shell: powershell
      run: |
        $pool = "backendService"
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"

        $state = & $appcmd list apppool "$pool" /text:state

        if ($state -ne "Started") {
          Write-Host "Starting App Pool: $pool"
          & $appcmd start apppool /apppool.name:"$pool"
        }
        else {
          Write-Host "App Pool $pool already started - OK"
        }
